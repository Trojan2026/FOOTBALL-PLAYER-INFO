<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Player Card</title>
  <link rel="stylesheet" href="Css/saka.css">
</head>
<body>

  <section class="player-card">
    <button class="follow-btn">Follow</button>

    <!-- Replace with your own player image (transparent PNG works best) -->
    <img class="player-img" src="static/Images/Saka 7.png" alt="Bukayo Saka">

    <div class="player-info">
      <p class="first-name">Bukayo</p>
      <h1 class="last-name">Saka</h1>
      <p class="team-line">
        <img class="crest" src="static/Images/Arsenal_FC.png" alt="Arsenal">
        <span>Arsenal</span>
        <span class="dot"></span>
        <span>7 Forward</span>
      </p>
    </div>
  </section>

</body>
</html>
